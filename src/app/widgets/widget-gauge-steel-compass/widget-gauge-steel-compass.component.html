<svg
  class="compass"
  [class.stale]="heading() === null"
  viewBox="0 0 500 500"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  [attr.aria-label]="displayName() + ' ' + headingText() + ' ' + unitLabel()"
>
  <defs>
    <linearGradient [attr.id]="gradientId() + '-bezel'" x1="0.12" y1="0" x2="0.72" y2="1">
      @for (stop of bezelStops(); track $index) {
        <stop [attr.offset]="stop.offset" [attr.stop-color]="stop.color" />
      }
    </linearGradient>

    <radialGradient [attr.id]="gradientId() + '-face'" cx="50%" cy="36%" r="74%">
      @for (stop of faceStops(); track $index) {
        <stop [attr.offset]="stop.offset" [attr.stop-color]="stop.color" />
      }
    </radialGradient>

    <radialGradient [attr.id]="gradientId() + '-screw'" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#F4F6F7" />
      <stop offset="0.5" stop-color="#AEB5B9" />
      <stop offset="1" stop-color="#565C60" />
    </radialGradient>

    <linearGradient [attr.id]="gradientId() + '-lcd'" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" [attr.stop-color]="finish().lcdTop" />
      <stop offset="1" [attr.stop-color]="finish().lcdBottom" />
    </linearGradient>

    <radialGradient [attr.id]="gradientId() + '-glass'" cx="34%" cy="16%" r="66%">
      <stop offset="0" [attr.stop-color]="finish().glass" />
      <stop offset="1" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>

  <!-- Case: bezel ring, then the dial face sunk inside it. -->
  <circle cx="250" cy="250" r="246" [attr.fill]="'url(#' + gradientId() + '-bezel)'" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="3" />
  <circle cx="250" cy="250" r="206" [attr.fill]="'url(#' + gradientId() + '-face)'" />
  <circle cx="250" cy="250" r="199" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2" />

  <!-- The card. It turns against the heading so the number you are steering sits under the index. -->
  <g class="card" [attr.transform]="'rotate(' + cardRotation() + ' 250 250)'">
    @for (tick of cardTicks(); track $index) {
      <line
        [attr.x1]="tick.x1" [attr.y1]="tick.y1" [attr.x2]="tick.x2" [attr.y2]="tick.y2"
        [attr.stroke]="tick.stroke" [attr.stroke-width]="tick.width"
      />
    }
    @for (label of cardLabels(); track $index) {
      <text
        [attr.x]="label.x" [attr.y]="label.y"
        [attr.fill]="label.fill" [attr.font-size]="label.size" [attr.font-weight]="label.weight"
        [attr.transform]="label.rotate"
        text-anchor="middle" dominant-baseline="central"
      >{{ label.text }}</text>
    }
    <circle cx="250" cy="250" r="12" fill="none" [attr.stroke]="finish().tickMinor" stroke-width="2" />
  </g>

  <!-- Fixed-card mode only: the card is parked north-up and this pointer swings to the heading. -->
  @if (!cardTurns()) {
    <g class="pointer" [attr.transform]="'rotate(' + pointerRotation() + ' 250 250)'">
      <path d="M 250 86 L 257 250 L 250 306 L 243 250 Z" [attr.fill]="finish().index" />
      <circle cx="250" cy="250" r="16" [attr.fill]="'url(#' + gradientId() + '-screw)'" stroke="rgba(0,0,0,.4)" stroke-width="2" />
    </g>
  }

  <!-- Widget name, clear of the card's own printing. -->
  @if (displayName()) {
    <text
      class="face-title"
      x="250" y="196"
      [attr.fill]="finish().dim"
      text-anchor="middle" dominant-baseline="central"
    >{{ displayName() }}</text>
  }

  <!-- Digital heading. -->
  <g class="lcd">
    <rect x="155" y="286" width="190" height="58" rx="4" [attr.fill]="'url(#' + gradientId() + '-lcd)'" />
    <rect x="155" y="286" width="190" height="58" rx="4" fill="none" stroke="rgba(0,0,0,.42)" stroke-width="2" />
    <text class="lcd-unit" x="167" y="316" [attr.fill]="finish().lcdInk" dominant-baseline="central">{{ unitLabel() }}</text>
    <text class="lcd-value" x="333" y="316" [attr.fill]="finish().lcdInk" text-anchor="end" dominant-baseline="central">{{ headingText() }}</text>
  </g>

  <!-- The index: what you read the card against, fixed at the bow. It stays a mark at the rim —
       anything reaching towards the middle of the dial reads as a magnetic needle instead. -->
  <path d="M 250 52 L 263 26 L 237 26 Z" [attr.fill]="finish().index" />
  <line x1="250" y1="50" x2="250" y2="74" [attr.stroke]="finish().index" stroke-width="4" />

  <!-- Glass, then the two case screws on top of it. -->
  <ellipse cx="205" cy="160" rx="172" ry="132" [attr.fill]="'url(#' + gradientId() + '-glass)'" />
  @for (screw of screws(); track $index) {
    <g>
      <circle [attr.cx]="screw.x" [attr.cy]="screw.y" r="10" [attr.fill]="'url(#' + gradientId() + '-screw)'" stroke="rgba(0,0,0,.45)" />
      <line [attr.x1]="screw.x - 6" [attr.y1]="screw.y" [attr.x2]="screw.x + 6" [attr.y2]="screw.y" stroke="rgba(0,0,0,.4)" stroke-width="2" />
    </g>
  }
</svg>
